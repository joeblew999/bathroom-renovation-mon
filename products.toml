#
# Each product:
#   id         what materials.toml, layout.toml and site.toml call it
#   name_th, name_en   the product only (no shop codes). A name can show the size below:
#              {w} {h} {d} in mm, or {w_cm} {h_cm} {d_cm} in cm — never type the size twice.
#   size       { w, h, d } in mm — only for products the drawings or the tile count use
#              (w wide, h high, d deep; a tile is w × h)
#   per_box    tiles in a box (tiles only)

