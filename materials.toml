# materials.toml — every material, in groups. materials.py reads it and renders the material list in
# the document, ordered by exactly two things written here:
#   1. group   — one section per group, in the order the groups are written below
#   2. status  — within a group: buy, then bought, then reused, then supplied
# Lines with the same group and status keep the order of their products here.
#
# The shops, suppliers, units and groups are defined here and nowhere else: materials don't refer
# to the phases or the drawings, and they don't refer to materials. The work can be rewritten,
# split or reordered without touching this file, and the other way round.
#
# Each shop: id, name, sku (what its product codes look like, a regular expression), link (the
#   product page: {sku} is the code, {sku_digits} the code without its dots).
# Each supplier (a trade that brings things itself): id, th, en — shown as "th / en".
# Each unit: id, th, en_one, en_many — "1 ถุง / bag", "7 ถุง / bags" (Thai has one form).
# Each group: id, th, en.
#
# Each product is listed once, by its id in products.toml (what it is: its names, its size),
# with how it is bought:
#   id         the product in products.toml
#   unit       the id of a unit, shown after the quantity (optional)
#   price      the unit price, in baht (not for reused or supplied products)
#   approx     true: the price is approximate ("ประมาณ / approx."), and the total is rounded
#   shop, sku  where it is bought and its product code; the link is built from them
#              (not for reused or supplied products)
# and has one [[product.use]] for each line it takes on the list:
#   group      the id of a group (things used all over go under whole_room)
#   status     "buy"      — still to buy (the product needs a price)
#              "bought"   — already on site, paid for
#              "reused"   — an old fitting on site, reused
#              "supplied" — the trade brings it: needs `by`
#   n          how many
#   note_th, note_en   what it is for here, or advice when buying (optional)
#   by         who brings a supplied product: the id of a supplier
# A product partly on site and partly to buy has two uses (bought n, buy n).
#
# [labels]: the fixed wording of the list (column headings, the total, buy, approx.).

[labels]
item = { th = "สินค้า", en = "Item" }
qty = { th = "จำนวน", en = "Qty" }
price = { th = "ราคา", en = "Price" }
on_site = { th = "ที่หน้างาน", en = "On site" }
still_to_buy = { th = "ยังต้องซื้อ", en = "Still to buy" }
buy = { th = "ซื้อ", en = "buy" }
approx = { th = "ประมาณ", en = "approx." }
about = { th = "ประมาณ", en = "about" }

