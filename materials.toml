# materials.toml — every material, in groups. materials.py reads it and renders the material list in
# the document, ordered by exactly two things written here:
#   1. group   — one section per group, in the order the groups are written below
#   2. status  — within a group: buy, then bought, then reused
# Items with the same group and status keep the order written here.
#
# The groups are defined here and nowhere else: materials don't refer to the phases or the
# drawings, and they don't refer to materials. The work can be rewritten, split or reordered
# without touching this file, and the other way round.
#
# Each group: id, th, en.
# Each item:
#   group    the id of one of the groups below (things used all over go under whole_room)
#   status   "buy"    — still to buy (needs a price)
#            "bought" — already on site, paid for (price optional: what it cost)
#            "reused" — an old fitting on site, reused (no price)
#   name     "ไทย / English" — the product only (no codes: the SKU has its own field)
#   note     "ไทย / English" — what it is for, or advice when buying (optional)
#   n        how many
#   price    the unit price, in baht
#   unit     shown after the quantity, e.g. "กล่อง / boxes"
#   approx   true: the price is approximate ("ประมาณ / approx."), and the total is rounded
#   tile     a tile colour ("grey" / "white"): n counts as boxes of it in the tile check
#   shop     where it is bought: "homepro" or "ikea" (not for reused fittings)
#   sku      the shop's product code; the product link is built from shop + sku
# An item that is partly on site and partly to buy is two items (bought n, buy n).

