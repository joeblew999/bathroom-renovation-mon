# materials.toml — every product, once: what it is, how it's bought, and its lines on the list.
# materials.py reads it and renders the materials list; room.toml names products by id and takes
# their names and sizes from here. The list is ordered by exactly two things written here:
#   1. work_section — one section per work section (by trade), in the order they are written below
#   2. status       — within a work section: procure, then procured, then existing, then by_trade
# Lines with the same work section and status keep the order of their entries here.
# Nothing here refers to the phases or the room, and the phases don't refer to it.
# Keys are written in the order shown here; leave a key out when it doesn't apply.
#
# prices_date, date_format: the day the prices were checked, and how it is shown.
# round_approx: an approximate total is rounded to this many baht.
# [section]: this part's heading and note (th, en, note_th, note_en — the shape of a work section or a
#   phase). The note can show {prices_date} and {approx} (the "approx." label).
# [labels]: the fixed wording of the list. [symbols]: its marks, the same in both languages.
#
# Every named thing here — a shop, a unit, a work section, a product — has th and en, its name; each id
#   says what it is.
# Each shop: id, th, en, sku (what its product codes look like, a regular expression), link (the
#   product page: {sku} is the code, {sku_digits} the code without its dots).
# Each unit: id, th, en, en_many — "1 ถุง / bag", "7 ถุง / bags" (Thai has one form).
# Each work section: id, th, en, and an optional note (note_th, note_en) shown under its heading.
#
# Each [[entry]] is one product:
#   id         what room.toml calls it
#   th, detail_th, en, detail_en   in this order: the name and the detail, in Thai then English
#              name: the kind and the brand — Thai kind first ("ประตู AZLE"), English brand
#              first ("AZLE door"); no brand → the kind alone. No shop codes.
#              detail: the rest, in the same order in both: model, material, size, pack,
#              colour, finish, then what it comes with or can do — Thai separated by spaces,
#              English by commas. A product with a size shows it. Sizes w × h × d, with spaced ×;
#              inches as " (Thai นิ้ว); a pack as "pack of 3" (Thai แพ็ก 3 …); a length in Thai as
#              ยาว …. What it is for goes in a line's note, not here. The list shows
#              "name detail" / "name, detail". Either shows the size with {w} {h} {d} in mm,
#              {w_cm} … in cm or {w_m} … in m — never type a dimension twice.
#   size       { w, h, d } in mm: its dimensions (w wide, h high, d deep; a tile is w × h). A
#              single figure that isn't a dimension — a weight, a volume, a stock length, an inch
#              trade size — stays in the detail ("50 kg", "4 m", "½\"")
#   per_box    tiles in a box (tiles only)
#   electrical true for an electrical product (the electrical zones round the shower apply to it)
#   ip         electrical products: the ingress protection rating on its product page ("IP44"; the
#              second digit is the protection against water). Its detail shows it with {ip}.
#   unit       the id of its unit, shown after the quantity
#   price      the unit price, in baht (procure: needed; procured: what it cost, if known; else none)
#   approx     true: the price is approximate ("ประมาณ / approx."), and the total is rounded
#   shop, sku  where it is bought and its product code, together; the link is made from them
#              (not for existing or by_trade products)
#   assumed    the keys above whose values are assumed, not yet known for real (README rule 10);
#              mise run summary lists every one, to be replaced by the real figure
# and one [[entry.line]] for each line it takes on the list:
#   work_section  the id of a work section (things used all over go under whole_room)
#   status     "procure"  — still to procure (buy)
#              "procured" — already on site, paid for
#              "existing" — an existing fitting on site, reused
#              "by_trade" — supplied by the trade ("ช่างไฟนำมา / electrician provides")
#   n          how many
#   note_th, note_en   what it is for here, or advice when buying — never a figure the room
#              works out, never a fact held in the phases or the room, never the same note twice
#   by_th, by_en       by_trade lines only: who brings it
# A product partly on site and partly to procure has two lines (procured n, procure n).

prices_date = 2026-10-31
date_format = "%d/%m/%Y"    # how the prices date is shown
round_approx = 100         # an approximate total is rounded to this

[section]
th = "รายการวัสดุ"
en = "Materials list"
note_th = "ราคา ณ วันที่ {prices_date} · \"{approx}\" = ราคาอาจเปลี่ยนแปลง"
note_en = "Prices as of {prices_date} · \"{approx}\" = the price may change"

[labels]
item = { th = "สินค้า", en = "Item" }
qty = { th = "จำนวน", en = "Qty" }
price = { th = "ราคา", en = "Price" }
on_site = { th = "ที่หน้างาน", en = "On site" }
still_to_buy = { th = "ยังต้องซื้อ", en = "Still to buy" }
buy = { th = "ซื้อ", en = "buy" }
approx = { th = "ประมาณ", en = "approx." }
about = { th = "ประมาณ", en = "about" }
detail = { th = " ", en = ", " }     # between a product's name and its detail
# A design problem (materials_design_checks.py), quantities: a note for the architect.
warn_take_off_short = { th = "กระเบื้อง{tile}: ถอดปริมาณแล้วต้องใช้ {boxes} กล่อง แต่ในรายการสั่งไว้ {planned} กล่อง — สั่งเพิ่มเสียตั้งแต่ตอนนี้จากล็อตเดียวกัน เพื่อให้เฉดสีตรงกัน", en = "{tile} tile: the take-off needs {boxes} boxes, but the materials list orders {planned} — order the rest now, from the same batch, so the shade matches" }

# The marks on the list — the same in both languages, so one value each.
[symbols]
currency = "฿"
on_site = "✓"
none = "—"
times = "×"

