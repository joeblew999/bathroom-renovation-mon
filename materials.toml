# materials.toml — every material, in groups. tables.py turns it into the material list in
# the document: one section per group, in the order the groups are written here. Within a
# group the order follows from the data: to buy first, then on site (bought), then reused;
# items with the same status keep the order written here.
#
# The groups are defined here and nowhere else: materials don't refer to the phases or the
# drawings, and they don't refer to materials. The work can be rewritten, split or reordered
# without touching this file, and the other way round.
#
# Each group: id, th, en.
# Each item:
#   group    the id of one of the groups below (things used all over go under whole_room)
#   name     "ไทย / English" — the product only; it links to `link`
#   note     "ไทย / English" — what it is for, or advice when buying (optional)
#   buy      how many still to buy                                     (default 0)
#   have     how many are already on site                              (default 0)
#   reused   true: what is on site is an old fitting, reused          (default false)
#   price    the unit price, in baht — needed for anything to buy
#   unit     shown after the quantity, e.g. "กล่อง / boxes"
#   approx   true: the price is approximate ("ประมาณ / approx."), and the total is rounded
#   tile     "grey" / "white": have + buy count in the tile check

