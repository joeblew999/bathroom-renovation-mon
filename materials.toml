# materials.toml — every material and its price. tables.py turns it into the material list
# in the document, grouped by phase in working order.
#
# Each item: name = "ไทย / English" (as shown in the list); the name links to `link`
#   phase = the id of the phase it is needed for (phases.toml) — the list is grouped by it
#   on_site = true (already here: bought and delivered, or existing and reused) / false (still to buy)
#   n + price   -> quantity × unit price (the total is worked out)
#   qty + total -> a quantity in words and a lump-sum total
#   approx = true -> shown as "ประมาณ / approx." and the still-to-buy total is rounded
#   unit = shown after n, e.g. "กล่อง / boxes"
#   tile = "grey" / "white" -> its boxes (`boxes`, or n) count in the tile check
#   fallback = true -> listed but not added to the total
# Items still to buy need n + price, or total. Name the product, not the job: how and
# where it is used belongs in phases.toml, sizes of the room in site.toml.

