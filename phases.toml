# phases.toml — the work, phase by phase. phases.py reads, numbers and renders it.
#
# Phases and steps are numbered by their position here (phase 1, 2, … · step 1.1, 1.2, …).
# Refer to them in this file or in the document by id:
#   {phase:make_good}  -> 5        {step:clear_mark}  -> 1.8
# so inserting or moving a step renumbers every reference.
#
# Each phase: id, th, en, optional note_th / note_en.
# Each step: id, th, en (the Thai and English text of the step).
# Materials are not listed here and don't refer to phases: materials.toml stands on its own.
#
# Write what to do and in what order. Sizes and positions live in room.toml / layout.toml
# and show on the drawings — don't copy them into the text; point to the drawing instead.
# Numbers that are method (a 2–3 cm fall, 2 coats, 400 mm centres) belong here, once.
#
# [section]: this part's heading in the document, and its note (th, en, note_th, note_en —
# the same shape as a phase).
# [labels]: the fixed wording around the phases (heading, step-table columns).

[section]
th = "งานตามขั้นตอน"
en = "Work by phase"
note_th = "เรียงตามลำดับการทำงาน แต่ละขั้นต้องเสร็จก่อนเริ่มขั้นถัดไป"
note_en = "In working order — each phase finishes before the next starts."

[labels]
phase_heading = { th = "ขั้น {number} — {name}", en = "Phase {number} — {name}" }
step_columns = { th = "ภาษาไทย", en = "English" }

[[phase]]
id = "strip_out"
th = "รื้อถอน"
en = "Strip out"

[[phase.step]]
id = "isolate"
th = "ปิดน้ำ และตัดไฟวงจรห้องน้ำ"
en = "Turn off the water and isolate the bathroom circuits"

[[phase.step]]
id = "plate_off"
th = "ถอดชุดสวิตช์ไฟพร้อมปลั๊ก 2 ช่อง และเบรกเกอร์เครื่องทำน้ำอุ่นที่ผนังประตูเดิม — เก็บไว้ใช้ต่อ · เก็บปลายสายให้ปลอดภัย"
en = "Remove the switch-and-socket plate (light switch + 2 sockets) and the water-heater breaker from the old door wall — keep them for reuse · make the cable ends safe"

[[phase.step]]
id = "wall_out"
th = "สกัดผนังประตูห้องน้ำเดิมออกทั้งผนัง พร้อมประตูและวงกบ — ห้องโล่ง รื้อฝ้าและขนเศษออกได้ง่าย"
en = "Break out the whole old door wall, door and frame included — opens up the room, making the ceiling easier to take down and the debris easier to get out"

[[phase.step]]
id = "toilet_basin_out"
th = "ถอดชักโครกและอ่างล้างหน้าเดิมออก อุดปลายท่อชั่วคราว · ถอดสายฉีดชำระเดิม — เก็บไว้ใช้ต่อ"
en = "Remove the old toilet and basin, and cap the pipe ends temporarily · remove the existing bum gun — keep it for reuse"

[[phase.step]]
id = "heater_out"
th = "ถอดเครื่องทำน้ำอุ่น สายน้ำดีทั้ง 2 เส้น ฝักบัว และกล่องไฟฟ้าออก เก็บไว้ใช้ต่อ — วัดระยะรูยึดเครื่องทำน้ำอุ่นเก็บไว้"
en = "Remove the water heater, its 2 hoses, the shower head and the electrical box, and keep them for reuse — measure the heater's fixing holes"

[[phase.step]]
id = "stop_tap_off"
th = "ถอดสต็อปวาล์วที่จ่ายน้ำเข้าเครื่องทำน้ำอุ่น เก็บไว้ใช้ต่อ แล้วอุดปลายท่อ — ท่อไม่ย้าย"
en = "Take off the stop tap that feeds the water heater, keep it, and cap the pipe — the pipe itself doesn't move"

[[phase.step]]
id = "ceiling_out"
th = "ถอดโคมไฟเพดานเดิมและรื้อสายออกทั้งเส้น · รื้อฝ้าห้องน้ำออกทั้งหมด (แผ่นและโครง) รวมถึงแผ่นฝ้าห้องนั่งเล่นที่อยู่เลยแนวผนังใหม่ — ยกออกทั้งแผ่น ไม่ต้องตัด เพราะโครงฝ้าห้องนั่งเล่นตรงกับแนวผนังใหม่พอดี"
en = "Remove the old ceiling light and pull out its cable · take down the whole bathroom ceiling (tiles and grid), plus the living-room ceiling tiles on the bathroom side of the new wall line — whole tiles lift out, no cutting, because the living-room grid lines up exactly with the new wall"

[[phase.step]]
id = "wall_tiles_off"
th = "สกัดกระเบื้องผนังที่เหลือออก"
en = "Chip off the remaining wall tiles"

[[phase.step]]
id = "debris"
th = "ขนเศษวัสดุไปทิ้งอย่างถูกต้อง — ช่างจ่ายค่าทิ้ง ไม่ทิ้งข้างถนน"
en = "Take the debris away and dispose of it properly — the builder pays the fee, no roadside dumping"

[[phase.step]]
id = "clear_mark"
th = "ขูดหรือเจียรก้อนปูนเดิมออกจากผนัง ตรวจด้วยไม้บรรทัดยาว 2 ม. และทำเครื่องหมายจุดที่ไม่เรียบเกิน 3 มม. (กระเบื้องขอบตรงร่องแคบจะเห็นทุกจุด) — อุดในขั้น {phase:make_good}"
en = "Scrape or grind the old mortar lumps off the walls, check them with a 2 m straightedge, and mark anywhere out by more than 3 mm (rectified tiles with tight joints show every bump) — filled in phase {phase:make_good}"

[[phase]]
id = "build_wall"
th = "ก่อผนังใหม่"
en = "Build the new wall"
note_th = "ผนังใหม่ยังไม่ฉาบ — ฉาบหลังงานระบบ ในขั้น {phase:make_good} · ขนาดและตำแหน่งตามภาพผนังใหม่"
note_en = "The new wall is not plastered yet — it is plastered after first fix, in phase {phase:make_good} · sizes and positions as on the new wall drawing"

[[phase.step]]
id = "wall"
th = "ก่อผนังข้างประตูด้วยอิฐมวลเบาและปูนก่ออิฐมวลเบา ขึ้นถึงระดับหลังประตู เว้นช่องประตูระหว่างผนังกับเสา · ยึดเข้ากับผนังมุมเดิม (ไม่ใช่เสา) ด้วยเหล็กหนวดกุ้งเจาะเสียบทุก 2 แถว"
en = "Build the wall beside the door in AAC block laid with AAC block mortar, up to the top of the door opening, leaving the opening between it and the column · tied into the existing corner wall (not the column) with steel ties drilled in every 2 courses"

[[phase.step]]
id = "lintel"
th = "วางคานทับหลังสำเร็จรูปมวลเบาเหนือช่องประตู ตัดให้ได้ความยาวที่หน้างาน ปลายด้านหนึ่งสอดเข้าช่องตื้นที่สกัดในเสาเดิม (เสากว้างประมาณ 2 เท่าของความหนาอิฐ ระวังไม่ให้โดนเหล็กเสริม) อีกด้านวางบนผนัง · แล้วก่อเต็มความยาวผนังขึ้นถึงฝ้า"
en = "Set the precast AAC lintel over the door opening, cut to length on site, one end in a shallow pocket cut in the existing column (the column is about twice the block width; keep clear of the reinforcement), the other end on the wall · then full-length courses up to the ceiling"

[[phase.step]]
id = "frame"
th = "ติดตั้งวงกบประตูในช่องประตู ด้านบานพับยึดเข้ากับเสาเดิม อีกด้านยึดเข้ากับผนังอิฐมวลเบา"
en = "Fit the door frame into the opening, hinge side fixed to the existing column, the other side to the AAC wall"

[[phase]]
id = "build_ceiling"
th = "ทำฝ้าใหม่"
en = "Build the new ceiling"

[[phase.step]]
id = "ceiling"
th = "**โครง:** ติดฉากริมเหล็กชุบสังกะสีรอบห้องที่ระดับฝ้าเดิม แล้ววางซีลายพาดขวางห้องบนฉากริมของผนังยาวทั้งสองด้าน ทุก 40 ซม. — ช่วงสั้น ไม่ต้องใช้ลวดแขวน"
en = "**Frame:** fix galvanised steel wall angle round the room at the old ceiling height, then lay C-channels across the room at 400 mm centres, resting on the wall angle on both long walls — the span is short, so no hanger wire is needed"

[[phase.step]]
id = "ceiling_board"
th = "**แผ่นฝ้า:** ยิงแผ่นยิปซัมทนชื้น 9 มม. เต็มฝ้า เป็นฝ้าฉาบเรียบ"
en = "**Board:** screw up the 9 mm moisture-resistant gypsum board over the whole ceiling, for a flush finish"

[[phase]]
id = "mark"
th = "ทำเครื่องหมายตำแหน่ง"
en = "Mark positions"

[[phase.step]]
id = "mark"
th = "ในห้องที่ผนังเสร็จแล้ว ช่างและเจ้าของบ้านทำเครื่องหมายทุกจุดตามผังพื้นและภาพผนัง รวมถึงผนังใหม่ด้านห้องนั่งเล่น — ต้องทำก่อนเดินท่อและสายไฟ"
en = "In the finished room shell, the builder and homeowner mark every position from the floor plan and wall drawings, plus the living-room face of the new wall — before any pipes or cable go in"

[[phase]]
id = "first_fix"
th = "งานระบบ"
en = "First fix"

[[phase.step]]
id = "switch_recess"
th = "**สวิตช์:** เซาะช่องฝังชุดสวิตช์พร้อมปลั๊กและเบรกเกอร์ (ของเดิม) ในอิฐมวลเบาของผนังใหม่ (ยังไม่ฉาบ) ด้านห้องนั่งเล่น"
en = "**Switch:** cut recesses for the reused switch-and-socket plate and breaker into the new wall's bare blockwork (not yet plastered), living-room side"

[[phase.step]]
id = "lamp_cable"
th = "**โคมไฟ:** เซาะร่องเดินสายโคมไฟจากสวิตช์ไปตามผนังหลัก ถึงโคมไฟดวงที่ 1 แล้วดวงที่ 2 — สายเส้นเดียวไม่มีจุดต่อ ต่อสายเฉพาะที่สวิตช์และที่โคมไฟ"
en = "**Lamps:** chase the lamp cable from the switch along the main wall to lamp 1, then lamp 2 — one unbroken run, joints only at the switch and the lamps"

[[phase.step]]
id = "heater_cable"
th = "**เครื่องทำน้ำอุ่น:** เลื่อนเข้าหามุมผนังหน้าต่าง (ภาพผนังหลัก) ใช้สายเดิม ถ้าไม่ถึง ต่อในกล่องไฟฟ้าเครื่องทำน้ำอุ่น ไม่ต่อในผนัง · เก็บปลายสายทั้งหมด — วงจรเดิมมีกันดูด 30 mA แล้ว"
en = "**Water heater:** it moves towards the window-wall corner (main wall drawing) on its existing cable; if the cable doesn't reach, join it inside the heater's electrical box, never in the wall · cap all the cable ends — the circuit already has 30 mA earth-leakage protection"

[[phase.step]]
id = "toilet_waste"
th = "**ท่อโสโครก:** ผ่าพื้นจากตำแหน่งชักโครกเดิมไปตำแหน่งใหม่ วางท่อ 4 นิ้ว ลาดเอียง 2–3 ซม. ใช้ข้องอ 45°"
en = "**Toilet waste:** cut a trench from the old toilet position to the new one and lay the 4\" pipe, falling 2–3 cm, with 45° bends"

[[phase.step]]
id = "cold_supply"
th = "**น้ำดี:** เซาะร่องผนังหลักฝังท่อน้ำดีไปชักโครกและอ่าง ตำแหน่งตามภาพผนังหลักและแบบติดตั้งของชักโครกและอ่าง (แนวท่อจริงจะระบุภายหลัง) · จุดน้ำเครื่องทำน้ำอุ่นใช้ที่เดิม ไม่ย้าย"
en = "**Cold water:** chase the main wall for the supply to the toilet and the basin — positions from the main wall drawing and the toilet and basin installation diagrams (exact routes to be confirmed) · the water heater's supply stays where it is"

[[phase.step]]
id = "toilet_outlet"
th = "**จุดน้ำชักโครก:** ชักโครกและสายฉีดชำระใช้จุดน้ำเดียวกันหลังชักโครก ด้วยสต็อปวาล์ว 2 ทาง — ตำแหน่งตามภาพผนังหลัก ความสูงตามแบบชักโครก เข้าถึงได้ทางช่องว่างด้านหลังชักโครก"
en = "**Toilet outlet:** the toilet and the bum gun share one outlet behind the toilet, with a 2-way stop valve — where the main wall drawing shows it, at the height on the toilet's diagram, reached through the gap at the back of the toilet"

[[phase.step]]
id = "basin_waste"
th = "**ท่อน้ำทิ้งอ่าง:** ท่อ 1½ นิ้วในผนังหลัก ตำแหน่งตามภาพผนังหลัก · ท่อระบายน้ำพื้นใช้ท่อเดิม"
en = "**Basin waste:** the 1½\" waste in the main wall, where the main wall drawing shows it · the floor drain keeps its existing pipe"

[[phase.step]]
id = "test"
th = "เปิดน้ำดูทุกรอยต่อว่าไม่รั่วซึม และเปิดไฟดูว่าใช้ได้ — ห้ามปิดผนังหรือปูกระเบื้องจนกว่าไม่มีรั่ว"
en = "Turn the water on and check every joint for drips, and switch on to check everything works — nothing is closed up or tiled until there are no leaks"

[[phase]]
id = "make_good"
th = "เก็บงานและฉาบ"
en = "Make good and plaster"

[[phase.step]]
id = "secure"
th = "ยึดท่อทุกเส้นและชุดสวิตช์ในร่องให้แน่น ไม่ให้ขยับตอนอุด"
en = "Fix every pipe, and the switch-and-socket plate, firmly in its chase so nothing moves when it is filled"

[[phase.step]]
id = "fill_floor"
th = "**พื้น:** อุดร่องท่อชักโครกและแนวผนังเดิมบนพื้นด้วย TPI M300 ให้เสมอกระเบื้องพื้นเดิมแต่ละฝั่ง · คงขั้นพื้นเดิมไว้ ช่างปูกระเบื้องปรับตำแหน่งในขั้น {phase:tile}"
en = "**Floor:** fill the toilet trench and the old wall line with TPI M300, flush with the old floor tiles on each side · keep the existing step; the tiler sets its final position in phase {phase:tile}"

[[phase.step]]
id = "fill_walls"
th = "**ผนังและเสา:** อุดด้วย TPI M300 — รอยแหว่งตรงที่สกัดผนังประตูเดิมออก · ร่องท่อและสายไฟทั้งหมด ร่องลึกอุด 2 ชั้น · จุดไม่เรียบที่ทำเครื่องหมายไว้ในขั้น {step:clear_mark}"
en = "**Walls and column:** fill with TPI M300 — the broken edges where the old door wall came out · every pipe and cable chase, deep ones in 2 layers · the uneven spots marked in step {step:clear_mark}"

[[phase.step]]
id = "plaster"
th = "**ฉาบ:** ฉาบผนังใหม่ทั้งสองด้านด้วยปูนฉาบอิฐมวลเบา TPI M210 ตรวจระนาบด้วยไม้บรรทัดยาว 2 ม. (กระเบื้องขอบตรงจะเห็นทุกจุดที่ไม่เรียบ) แล้วปล่อยให้แห้ง"
en = "**Plaster:** plaster both faces of the new wall with TPI M210 AAC plaster, check it is flat with a 2 m straightedge (rectified tiles show every bump), then let it cure"

[[phase.step]]
id = "skim"
th = "**ส่วนที่ทาสี:** ร่องที่อยู่เหนือแนวกระเบื้อง ปิดผิวบางๆ ด้วยปูนฉาบ M210 ที่เหลือ ให้เรียบพร้อมทาสี"
en = "**Painted area:** skim any chase above the tile line with leftover M210 so it paints smooth"

[[phase.step]]
id = "ceiling_joints"
th = "**ฝ้า:** ฉาบรอยต่อทุกแนวและหัวสกรูด้วยเทปและปูนยาแนวให้เรียบ"
en = "**Ceiling:** tape and fill every joint and screw head smooth"

[[phase]]
id = "paint_ceiling"
th = "ทาสีฝ้า"
en = "Paint the ceiling"

[[phase.step]]
id = "paint_ceiling"
th = "ทาสีฝ้าด้วยสีขาวกึ่งเงาที่มีอยู่แล้ว (ไม่ใช้สีรองพื้น) — ก่อนปูกระเบื้อง ให้สีหยดลงบนพื้นผิวที่ยังไม่ปู"
en = "Paint the ceiling with the existing white semi-gloss paint (no primer) — before tiling, so drips land on surfaces not yet tiled"

[[phase]]
id = "waterproof"
th = "กันซึม"
en = "Waterproof"

[[phase.step]]
id = "waterproof"
th = "ทากันซึม FLEX SHIELD 2 รอบ รอให้แต่ละรอบแห้ง: ทั้งพื้น (บนกระเบื้องเดิมที่ล้างและขัดผิวให้หยาบแล้ว) ผนังหลักทั้งด้าน และผนังอื่นสูงอย่างน้อย 30 ซม. — ไม่มีกระจกกั้นอาบน้ำ น้ำจะกระเด็นทั่วห้อง"
en = "Apply FLEX SHIELD in 2 coats, letting each coat dry: the whole floor (over the degreased, roughened old tiles), the full main wall, and at least 30 cm up the other walls — there is no shower screen, so water splashes across the room"

[[phase.step]]
id = "mesh"
th = "ฝังเทปตาข่ายไฟเบอร์ในรอบแรก ทุกรอยต่อที่อาจร้าว: รอยต่อผนังใหม่กับผนังเดิม เสา และพื้น (ห้องนั่งเล่นอยู่ด้านหลัง) · รอยต่อผนังหลักกับพื้น และมุมทั้งสอง (ห้องนอนอยู่ด้านหลัง) · รอบท่อระบายน้ำ · ขั้นพื้นทั้งแนว มุมบนและล่าง"
en = "Embed fibre mesh tape in the first coat at every joint that can crack: the new wall's joints with the existing wall, column and floor (living room behind) · the main wall's joint with the floor, and both its corners (bedroom behind) · around the drain · along the floor step, top and bottom edges"

[[phase]]
id = "tile"
th = "ปูกระเบื้อง"
en = "Tile"
note_th = "**กระเบื้องทั้งหมดเป็นกระเบื้องขอบตรง (Rectified)** ปูร่องยาแนวแคบประมาณ 1–2 มม. ใช้คลิปปรับระดับและกาวซีเมนต์ปูกระเบื้อง (ไม่ใช้ปูนทราย) สียาแนวให้เข้ากับสีกระเบื้อง ความสูง แถว และแผ่นตัดตามภาพ ทุกรู (ท่อ จุดยึดโคมไฟ สกรู) ห่างแนวยาแนวตามระยะที่ระบุในภาพ หรืออยู่กึ่งกลางแนวพอดีโดยสกรูอยู่สองข้างของแนว ห้ามเจาะตรงร่องยาแนว ขอบกระเบื้องจะบิ่น ระวังปลายสายไฟที่เก็บไว้ และเจาะรูกระเบื้องให้ตรงตำแหน่งโคมไฟและกล่องเครื่องทำน้ำอุ่น"
note_en = "**All tiles are rectified.** Tight grout joints of about 1–2 mm, levelling clips and cement-based tile adhesive (not sand-cement mortar), grout colour to match each tile. Tile heights, rows and cuts are as on the drawings. Every hole (pipes, lamp fixings, screws) clear of the joints by the distance stated on the drawings, or exactly centred on one with the screws either side — never drill in the grout line, it chips both tile edges. Protect the capped cable ends, and cut neat holes at the marked lamp and heater-box positions."

[[phase.step]]
id = "main_wall_tiles"
th = "**ผนังหลัก:** กระเบื้องเทา ไม่ต้องตัด — กระเบื้องเทาทุกแผ่นทั้งพื้นและผนังหันทิศทางเดียวกัน (ดูลูกศรหลังแผ่น) ให้ลายต่อเนื่อง และแนวยาแนวผนังตรงกับแนวยาแนวพื้น · แถวกระเบื้องวัดจากพื้นต่ำ แถวล่างฝั่งอ่าง (ด้านสูงของขั้นพื้น) ตัดสั้นลงเท่าความสูงขั้น"
en = "**Main wall:** grey tile, no cuts — every grey tile, floor and wall, facing the same direction (check the arrows on the back) so the pattern runs on, with the wall joints lined up with the floor joints · rows run level from the lower floor; on the basin side of the step (the higher floor) the bottom row is cut shorter by the step height"

[[phase.step]]
id = "white_tiles"
th = "**ผนังอีก 3 ด้าน:** กระเบื้องขาว · ผนังด้านประตู: ผนังข้างประตูและหน้าเสาตัดจากกระเบื้อง 1 แผ่นต่อแถว"
en = "**Other 3 walls:** white tile · door end: the wall beside the door and the column face are both cut from one tile per row"

[[phase.step]]
id = "step_tiles"
th = "**ขั้นพื้น:** วางกระเบื้องพื้นแห้งจากผนังใหม่ หาแนวยาแนวที่ใกล้ขั้นพื้นเดิมที่สุด แล้วเสริมผิวขั้นออกไปถึงแนวนั้นด้วยกาวซีเมนต์ขณะปู — ขยับเพียงเล็กน้อย จึงไม่มีแผ่นตัดที่ขั้น · ผิวขั้นปิดด้วยแถบกระเบื้องเทาตัด และคิ้วกันขอบที่จมูกขั้น"
en = "**Step:** dry-lay the floor tiles from the new wall, find the joint nearest the existing step, and build the step face out to it in tile adhesive as you lay — a small move, so there are no cut tiles at the step · clad the step face with a strip cut from grey tile, with an edge trim on the nosing"

[[phase.step]]
id = "floor_tiles"
th = "**พื้น:** กระเบื้องเทาปูทับกระเบื้องพื้นเดิม (แน่นดี) 2 ระดับ — ฝั่งอ่าง (ด้านสูงของขั้น) และฝั่งชักโครกและฝักบัว · ใช้ความลาดเอียงเดิมลงท่อระบายน้ำ · แผ่นตัดตามผังพื้น"
en = "**Floor:** grey tile over the existing (solid) floor tiles, on 2 levels — the basin end (the higher side of the step) and the toilet and shower end · keep the existing slope to the drain · cuts as on the floor plan"

[[phase.step]]
id = "drain"
th = "**ท่อระบายน้ำ:** ตั้งตะแกรง DEXZON บนท่อเดิมให้เสมอกระเบื้องใหม่ (พื้นสูงขึ้นประมาณ 12–15 มม.)"
en = "**Drain:** set the DEXZON grate on the existing pipe, level with the new tiles (the floor rises about 12–15 mm)"

[[phase.step]]
id = "grout"
th = "ปูพื้นเป็นอย่างสุดท้าย ห้ามเหยียบจนแห้ง แล้วยาแนว"
en = "The floor goes last: keep off it until it has set, then grout"

[[phase]]
id = "paint_walls"
th = "ทาสีผนัง"
en = "Paint walls"

[[phase.step]]
id = "paint"
th = "ทาสีผนังส่วนที่ไม่ได้ปูกระเบื้อง ผนังใหม่ด้านห้องนั่งเล่น และเก็บสีฝ้าตรงที่เปื้อน ด้วยสีเดียวกับฝ้า (ผนังเดิมสภาพดี อุดรอยเล็กน้อย) — คลุมพื้นและกระเบื้องก่อน"
en = "Paint the untiled walls and the living-room face of the new wall, and touch up any marks on the ceiling, with the same paint as the ceiling (the walls are in good condition, small patches only) — cover the floor and tiles first"

[[phase]]
id = "fit_out"
th = "ติดตั้งอุปกรณ์"
en = "Fit out"

[[phase.step]]
id = "door"
th = "ติดตั้งบานประตูใหม่ เจาะและติดตั้งลูกบิดห้องน้ำ"
en = "Hang the new door, and drill and fit the bathroom knob"

[[phase.step]]
id = "toilet"
th = "ติดตั้งชักโครกใหม่ และสายฉีดชำระเดิม ทั้งคู่ต่อจากสต็อปวาล์ว 2 ทางหลังชักโครก สายฉีดชำระเดินไปที่ขอแขวนระหว่างอ่างกับชักโครก"
en = "Install the new toilet and refit the existing bum gun, both fed from the 2-way stop valve behind the toilet, with the bum gun hose running to its holder between the basin and the toilet"

[[phase.step]]
id = "basin"
th = "ติดตั้งอ่างล้างหน้าแขวน — ยึดเข้ากับเนื้อผนังให้แน่น (ไม่ยึดแค่ปูนฉาบ)"
en = "Install the wall-hung basin — fixed securely into the wall itself (not just the plaster)"

[[phase.step]]
id = "heater_shower"
th = "ใส่สต็อปวาล์วเครื่องทำน้ำอุ่นกลับที่เดิม · ติดตั้งเครื่องทำน้ำอุ่นเดิมพร้อมกล่องไฟฟ้าและสายน้ำดีเดิม 2 เส้น และชุดฝักบัว ที่ผนังหลัก"
en = "Refit the water heater's stop tap in its original place · refit the existing water heater with its electrical box and its 2 existing hoses, and the shower unit, on the main wall"

[[phase.step]]
id = "accessories"
th = "ติดตั้งกระจก ชั้นวางพร้อมราวแขวนผ้า และที่ใส่กระดาษชำระ"
en = "Install the mirror, the shelf with towel rail, and the toilet roll holder"

[[phase.step]]
id = "lamps"
th = "ติดตั้งโคมไฟผนัง 2 ดวง ข้างกระจก"
en = "Fit the 2 wall lamps either side of the mirror"

[[phase.step]]
id = "plate"
th = "ติดตั้งชุดสวิตช์พร้อมปลั๊กเดิม (สวิตช์ควบคุมโคมไฟผนัง) และเบรกเกอร์เครื่องทำน้ำอุ่นเดิม ที่ผนังใหม่ด้านห้องนั่งเล่น"
en = "Refit the existing switch-and-socket plate (the switch now controls the wall lamps) and the water-heater breaker on the living-room face of the new wall"

[[phase]]
id = "hand_over"
th = "ทดสอบและส่งมอบ"
en = "Test and hand over"

[[phase.step]]
id = "test_handover"
th = "เปิดน้ำ ดูการระบายน้ำ เปิดโคมไฟ ลองปลั๊กทั้ง 2 ช่อง ลองเครื่องทำน้ำอุ่น และกดปุ่มทดสอบกันดูด · ทำความสะอาด · เจ้าของบ้านตรวจรับ"
en = "Run the water and check the drain, try the lamps, both sockets and the heater, and press the earth-leakage test button · clean up · homeowner's inspection"
