# labour.toml — the labour for the job, priced. labour.py reads, checks and renders it.
#
# Every rate comes from a rate book (README rule 10): its [[book]] says which document and how a rate names its
# place there (item_th, item_en, filling in {item}), its rate says the item in it and the page it was read from, and `checked` is the day the rates were read. A rate with no
# book is a stand-in: it must be marked assumed until the builder or the owner gives the real figure.
#
# Each [[line]] is one piece of labour on the list: the rate it is priced at, its work section, and where
# its quantity comes from — exactly one of:
#   take_off      a quantity the room works out from its sizes (room.py, take_off): its unit must be the rate's
#   count         products on the materials list, by id: how many of them the list has (the rate's unit: set,
#                 or metre for products bought by the metre); their names show under the line, from the list
#   of_products   products on the materials list, by id: the rate is a share of what they still cost to buy
#                 (the rate's unit: percent) — the book's rule for labour it doesn't list
#   n             a quantity written here, for work the room can't measure (marked assumed until measured)
# then optional: times (the quantity counted this many times: coats), note_th and note_en, assumed.
# A line's amount is its quantity, rounded to one decimal, times its rate, so every line adds up as shown.

checked = 2026-11-01        # the day the rates were read off their book
date_format = "%d/%m/%Y"    # how the date is shown
round_approx = 100          # an approximate total is rounded to this

[section]
th = "ค่าแรง"
en = "Labour"
note_th = "อัตราค่าแรงจาก: {books} — ตรวจ ณ วันที่ {checked} · อัตราของกรมบัญชีกลางเป็นค่าแรงล้วน ท้ายตารางจึงบวกค่าดำเนินการ กำไร และดอกเบี้ยของผู้รับเหมาด้วย Factor F แบบเดียวกับการคำนวณราคากลางงานราชการ เพื่อให้ได้ราคาอ้างอิงไว้เทียบกับใบเสนอราคาของผู้รับเหมา ราคาของโฮมโปรรวมค่าดำเนินการไว้แล้ว · วัสดุเจ้าของบ้านซื้อเอง จึงไม่บวก Factor F · \"{approx}\" = ยังเป็นค่าประมาณ รอยืนยัน"
note_en = "Rates from: {books} — checked {checked} · the Comptroller General's rates are bare labour, so at the foot Factor F adds the builder's overhead, profit and interest, as a government estimate does, to give a reference price to hold the builder's quote against; HomePro's prices already include theirs · the owner buys the materials, so Factor F isn't put on them · \"{approx}\" = a stand-in, still to be confirmed"

[labels]
item = { th = "งาน", en = "Work" }
qty = { th = "ปริมาณ", en = "Qty" }
amount = { th = "ค่าแรง", en = "Labour" }
book_note = { th = "หมายเหตุ {note}", en = "note {note}" }
of_products = { th = "{percent} ของค่าวัสดุ {cost}", en = "{percent} of materials costing {cost}" }
labour_total = { th = "รวมค่าแรง ตามอัตรา", en = "Labour total, at the rates" }
factor_qty = { th = "{base} × ({factor} − 1) เฉพาะอัตราของกรมบัญชีกลาง", en = "{base} × ({factor} − 1), on the Comptroller General's rates only" }
with_factor = { th = "ค่าแรง รวมค่าดำเนินการและกำไร (ราคาอ้างอิง)", en = "Labour with overhead and profit (reference price)" }
grand_total = { th = "รวมทั้งหมด (วัสดุที่ยังต้องซื้อ + ค่าแรงรวมค่าดำเนินการ)", en = "Grand total (materials still to buy + labour with overhead)" }
approx = { th = "ประมาณ", en = "approx." }
about = { th = "ประมาณ", en = "about" }

[symbols]
currency = "฿"
times = "×"
percent = "%"
dot = " · "      # between the books in the section's note

# Factor F: the Comptroller General's multiplier for a contractor's overhead, profit and interest on bare cost.
# Its table (ว481), building work, the smallest band (direct cost up to 0.5 million baht): 1.2199 in the column
# without VAT, 1.3052 with 7% VAT. A small builder usually doesn't charge VAT; if this one does, use 1.3052.
[factor_f]
th = "ค่าดำเนินการ กำไร และดอกเบี้ย: Factor F งานก่อสร้างอาคาร ค่างานไม่เกิน 0.5 ล้านบาท ไม่รวมภาษีมูลค่าเพิ่ม"
en = "Overhead, profit and interest: Factor F, building work, up to 0.5 million baht, without VAT"
value = 1.2199
standard = "กค ว481"
url = "https://www.yotathai.com/factorf/building/adv15-retain10"

[[book]]
id = "cgd_w480"
th = "บัญชีค่าแรงงานของกรมบัญชีกลาง"
en = "Comptroller General's labour rates"
standard = "กค 0433.2/ว 480, 26/06/2569"
url = "https://www.yotathai.com/labor-rates"
item_th = "ข้อ {item}"       # how a rate names its place in this book
item_en = "item {item}"
bare = true                  # its rates are bare labour: Factor F adds overhead, profit and interest

