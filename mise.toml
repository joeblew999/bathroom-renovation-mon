# mise.toml — pinned tools and every command for this repo.
# `mise tasks` lists the commands; `mise run setup` once, then `mise run build`.

[tools]
python = "3.13"

[env]
_.python.venv = { path = ".venv", create = true, uv_create_args = ["--seed"] }   # --seed: the venv gets its own pip

[tasks.setup]
description = "Install the pinned Python packages and the Chromium that prints the PDF"
run = [
  "python -m pip install -r requirements.txt",
  "python -m playwright install chromium",
  # On the GitHub runner only: Chromium's Linux libraries and fonts (including the Thai font)
  "if [ -n \"$CI\" ]; then python -m playwright install-deps chromium; fi",
]

[tasks.build]
description = "Build out/index.html and out/bathroom-renovation-quote.pdf (the same page, as web page and PDF)"
run = "python build_pdf.py"

[tasks.test]
description = "Break copies of the data on purpose and confirm every check fires"
run = "python test_pipeline.py"

[tasks.check]
description = "Print the tile counts, the still-to-buy total and any warnings, without building"
run = "python build_pdf.py --check"

[tasks.materials]
description = "Print the material list — the same table the PDF prints"
run = "python materials.py"

[tasks.phases]
description = "Print the phases — the same text the PDF prints"
run = "python phases.py"
