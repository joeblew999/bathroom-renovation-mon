# layout.toml — every position in the bathroom. project.py reads and checks it (tile joints,
# clashes, parts); draw_walls.py draws the floor plan and wall elevations from it.
#
# Units: mm. Each wall is seen from inside the bathroom, facing it.
#   x = distance to the item centre from the corner on your right
#       (main wall: from the new wall · window wall: from the main wall)
#   y = centre height above the lower finished floor (toilet/shower level)
#   w, h = width, height · d = depth out from the wall (for the floor plan)
# Floor items: x from the new wall, y from the main wall.
# shape on a wall: rect, circle, point (fixing), vline (pipe line), zone · on the floor: rect, step
# product = a size from site.toml (w, h, d are taken from there; give them here only to override)
# The column, door opening, lintel, window and floor-plan door follow from site.toml: only their
# names are here, under [site_items].
# part = number of the item this one belongs to (checked: it must sit within it)
# Leave a key out when it does not apply.
# Notes say why or how, not where: a note never repeats a position or size the drawing
# already shows (x, y, w, h, or anything worked out from them).

# ---------- items that follow from site.toml ----------
# Their positions and sizes are worked out from the room, door, lintel and window; only
# their names (and notes) are here.
