# room.toml — the room, the design rules, the four walls and the tiles. Units: mm.
# Product sizes are in products.toml (shared with the material list), never here.
# Read by room/; the drawings, the checks and the tile counts are worked out from it.
# Things that follow from these (the column, the door opening, the lintel, the window on
# its wall, the door on the floor plan) are worked out in room/, never typed here.

# ---------- the room ----------
[room]
length = 3000              # along the main wall
width = 1380               # along the new wall and the window wall
ceiling = 2800

[new_wall]
length = 1300              # the rest of the room width is the existing column

[door]
product = "door_frame"     # the opening is the frame's size (products.toml); hinged on the column side, opens in

[lintel]
product = "lintel"         # its height comes from the product (products.toml): one block course high
bearing = 150              # onto the wall; the column end sits in a shallow pocket

[old_wall]
step = 50                  # floor step, kept and moved to a floor-tile joint (layout.toml)

[window]
from_main_wall = 300
width = 600
sill = 1600                # bottom of the frame, no sill
height = 400

# ---------- rules ----------
[rules]
min_clear = 20             # every hole at least this far from a tile joint (or exactly on one)
                           # — checked on the drawings, and printed under each one

# ---------- the wording on the drawings ----------
# {name} fills in a value. A label with only `en` has nothing to translate.
[labels]
floor_plan = { th = "ผังพื้น", en = "Floor plan" }
elevation_title = { th = "{wall}{view}", en = "{wall}{view} — elevation" }
viewed_inside = { th = "มองจากในห้องน้ำ", en = "Viewed from inside the bathroom" }
seen_above = { th = "มองจากด้านบน", en = "Seen from above" }
mm = { th = "มม.", en = "mm" }
generated = { en = "generated from room.toml + layout.toml" }
tile_top = { th = "ขอบกระเบื้อง", en = "tile top {top}" }
floor_higher = { th = "พื้นยกสูง {h}", en = "floor {h} higher" }
higher = { th = "▲ สูง", en = "higher" }
lower = { th = "ต่ำ", en = "lower ▼" }
floor = { th = "พื้น", en = "floor" }
tag_main = { en = "M" }       # floor-plan tags: M1, F2, W3 … (the main wall, the floor, the window wall)
tag_floor = { en = "F" }
tag_window = { en = "W" }
axis_x = { en = "x" }         # the letters for position and size in the legends: x 1500  y 400  W 375 × H 700
axis_y = { en = "y" }
width = { en = "W" }
height = { en = "H" }
items = { th = "รายการ", en = "Items" }
x_from = { th = "{axis} จาก{wall}", en = "from the {wall}" }
centre_height = { th = "ความสูงกึ่งกลาง", en = "centre height" }
see_notes = { th = "ดูหมายเหตุ", en = "see notes" }
dashed = { th = "เส้นประ = ติดผนังด้านบน (มองจากบน)", en = "dashed = mounted higher on the wall, seen from above" }
all_clear = { th = "✓ ทุกจุดห่างแนวยาแนวอย่างน้อย {min_clear} มม. หรืออยู่กึ่งกลางแนวพอดี และไม่มีชิ้นใดทับกัน", en = "✓ Every centre is at least {min_clear} mm off a joint (or exactly centred on one), and nothing overlaps" }
tile_count = { th = "กระเบื้อง{tile} {need} แผ่น ({parts}) → ต้องใช้ {boxes} กล่อง วางแผนไว้ {planned} กล่อง (เหลือ {spare} แผ่น)", en = "{tile} {need} tiles ({parts}) → {boxes} boxes needed, {planned} planned ({spare} spare tiles)" }

# ---------- the four walls ----------
# Names used on every drawing, and which tile each wall gets (one of [tiles] below).
# Each wall's length, and which corner x is measured from, follow from the room (room/model.py).
[walls.main_wall]
th = "ผนังหลัก"
en = "Main wall"
tile = "grey"

[walls.new_wall]
th = "ผนังใหม่"
en = "New wall"
view_th = "ด้านในห้องน้ำ"   # drawn from inside the bathroom
view_en = "bathroom side"
tile = "white"

[walls.window_wall]
th = "ผนังหน้าต่าง"
en = "Window wall"
tile = "white"

[walls.opposite_wall]
th = "ผนังยาวตรงข้าม"
en = "Opposite long wall"
tile = "white"

# ---------- the floor ----------
[floor]
tile = "grey"

# ---------- tiles ----------
# One table per tile; its name ([tiles.NAME]) is what the floor and the walls call it. A new
# tile is a new table here — no code changes.
#   product  the tile in products.toml (its size and tiles per box come from there; the tile
#            count matches it against the boxes of that product on the material list)
#   th       its colour in Thai, for the tile counts
#   top      tiled up to this height on a wall, mm
#   fill     its colour on the drawings
[tiles.grey]               # the floor + the main wall
product = "grey_tile"
th = "เทา"
top = 2000
fill = "#d9d9d6"

[tiles.white]              # the other 3 walls
product = "white_tile"
th = "ขาว"
top = 1200
fill = "#f1f1ee"
