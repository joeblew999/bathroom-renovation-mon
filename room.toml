# left), its corners (facing it from inside: the next wall is on your right, at x = 0; the one
# before is on your left), and its length (the first and third run along the room's length).
#   th, en               its name · view_th, view_en: which side it is drawn from (optional)
#   tag                  its letter on the floor plan (M1, M2 …)
#   tile                 which tile it gets · drawn: true = it gets its own drawing

