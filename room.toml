# room.toml — the room: its size, the design rules, the four walls, the tiles, the wording on the
# drawings, and every position on the walls and the floor. Units: mm. room/ reads it.
# Product sizes come from materials.toml (by id), never typed here.
# Things that follow from these (the column, the door opening, the lintel, the window on
# its wall, the door on the floor plan) are worked out in room/, never typed here.

# ---------- the room ----------
[room]
length = 3000              # along the main wall
width = 1380               # along the new wall and the window wall
ceiling = 2800

[new_wall]
length = 1300              # the rest of the room width is the existing column

[door]
product = "door_frame"     # the opening is the frame's size (materials.toml); hinged on the column side, opens in
wall = "new_wall"          # the wall it is in: the existing column is at that wall's x = 0 end

[lintel]
product = "lintel"         # its height comes from the product (materials.toml): one block course high
bearing = 150              # onto the wall; the column end sits in a shallow pocket

[old_wall]
step = 50                  # floor step, kept and moved to a floor-tile joint (positions below)

[window]
wall = "window_wall"       # the wall it is in
from_corner = 300          # from that wall's x = 0 corner to the window's edge
width = 600
sill = 1600                # bottom of the frame, no sill
height = 400

# ---------- rules ----------
[rules]
min_clear = 20             # every hole at least this far from a tile joint (or exactly on one)
                           # — checked on the drawings, and printed under each one

# ---------- the wording on the drawings ----------
# {name} fills in a value. A label with only `en` has nothing to translate.
[labels]
floor_plan = { th = "ผังพื้น", en = "Floor plan" }
elevation_title = { th = "{wall}{view}", en = "{wall}{view} — elevation" }
viewed_inside = { th = "มองจากในห้องน้ำ", en = "Viewed from inside the bathroom" }
seen_above = { th = "มองจากด้านบน", en = "Seen from above" }
mm = { th = "มม.", en = "mm" }
generated = { en = "generated from room.toml" }
tile_top = { th = "ขอบกระเบื้อง", en = "tile top {top}" }
floor_higher = { th = "พื้นยกสูง {h}", en = "floor {h} higher" }
higher = { th = "▲ สูง", en = "higher" }
lower = { th = "ต่ำ", en = "lower ▼" }
floor = { th = "พื้น", en = "floor" }
tag_main = { en = "M" }       # floor-plan tags: M1, F2, W3 … (the main wall, the floor, the window wall)
tag_floor = { en = "F" }
tag_window = { en = "W" }
axis_x = { en = "x" }         # the letters for position and size in the legends: x 1500  y 400  W 375 × H 700
axis_y = { en = "y" }
width = { en = "W" }
height = { en = "H" }
items = { th = "รายการ", en = "Items" }
x_from = { th = "{axis} จาก{wall}", en = "from the {wall}" }
centre_height = { th = "ความสูงกึ่งกลาง", en = "centre height" }
see_notes = { th = "ดูหมายเหตุ", en = "see notes" }
dashed = { th = "เส้นประ = ติดผนังด้านบน (มองจากบน)", en = "dashed = mounted higher on the wall, seen from above" }
all_clear = { th = "✓ ทุกจุดห่างแนวยาแนวอย่างน้อย {min_clear} มม. หรืออยู่กึ่งกลางแนวพอดี และไม่มีชิ้นใดทับกัน", en = "✓ Every centre is at least {min_clear} mm off a joint (or exactly centred on one), and nothing overlaps" }
tile_count = { th = "กระเบื้อง{tile} {need} แผ่น ({parts}) → ต้องใช้ {boxes} กล่อง วางแผนไว้ {planned} กล่อง (เหลือ {spare} แผ่น)", en = "{tile} {need} tiles ({parts}) → {boxes} boxes needed, {planned} planned ({spare} spare tiles)" }

# ---------- the four walls ----------
# Each wall, seen from inside the bathroom facing it:
#   th, en       its name on every drawing
#   tile         which tile it gets (one of [tiles] below)
#   runs         "length" or "width": which side of the room it is (its length follows from [room])
#   right, left  the wall at its x = 0 corner (on your right) and at its far end
#   drawn        true: it gets its own elevation drawing (and positions below)
[walls.main_wall]
th = "ผนังหลัก"
en = "Main wall"
tile = "grey"
runs = "length"
right = "new_wall"
left = "window_wall"
drawn = true

[walls.new_wall]
th = "ผนังใหม่"
en = "New wall"
view_th = "ด้านในห้องน้ำ"   # drawn from inside the bathroom
view_en = "bathroom side"
tile = "white"
runs = "width"
right = "opposite_wall"
left = "main_wall"
drawn = true

[walls.window_wall]
th = "ผนังหน้าต่าง"
en = "Window wall"
tile = "white"
runs = "width"
right = "main_wall"
left = "opposite_wall"
drawn = true

[walls.opposite_wall]
th = "ผนังยาวตรงข้าม"
en = "Opposite long wall"
tile = "white"
runs = "length"
right = "window_wall"
left = "new_wall"
drawn = false

# The floor plan, seen from above: which wall is drawn on each side.
[plan]
top = "main_wall"
right = "new_wall"
bottom = "opposite_wall"
left = "window_wall"

# ---------- the floor ----------
[floor]
tile = "grey"

# ---------- tiles ----------
# One table per tile; its name ([tiles.NAME]) is what the floor and the walls call it. A new
# tile is a new table here — no code changes.
#   product  the tile in materials.toml (its size and tiles per box come from there; the tile
#            count matches it against the boxes of that product on the material list)
#   th       its colour in Thai, for the tile counts
#   top      tiled up to this height on a wall, mm
#   fill     its colour on the drawings
[tiles.grey]               # the floor + the main wall
product = "grey_tile"
th = "เทา"
top = 2000
fill = "#d9d9d6"

[tiles.white]              # the other 3 walls
product = "white_tile"
th = "ขาว"
top = 1200
fill = "#f1f1ee"


# ================================ every position ================================
# Checked (tile joints, clashes, parts) and drawn as the floor plan and wall elevations.
#
# Units: mm. Each wall is seen from inside the bathroom, facing it.
#   x = distance to the item centre from the corner on your right
#       (main wall: from the new wall · window wall: from the main wall)
#   y = centre height above the lower finished floor (toilet/shower level)
#   w, h = width, height · d = depth out from the wall (for the floor plan)
# Positions: [[positions.main_wall]], [[positions.window_wall]], [[positions.floor]].
# Floor items: x from the new wall, y from the main wall.
# shape on a wall: rect, circle, point (fixing), vline (pipe line), zone · on the floor: rect, step
# product = an entry in materials.toml (its w, h, d are taken from there; give them here only to override)
# The column, door opening, lintel, window and floor-plan door follow from room.toml: only their
# names are here, under [room_items].
# part = number of the item this one belongs to (checked: it must sit within it)
# Leave a key out when it does not apply.
# Notes say why or how, not where: a note never repeats a position or size the drawing
# already shows (x, y, w, h, or anything worked out from them).

# ---------- items that follow from the room (above) ----------
# Their positions and sizes are worked out from the room, door, lintel and window; only
# their names (and notes) are here.
# Notes never refer to the phases or steps: the steps point to the drawings, not the other way.
[room_items.column]
th = "เสาเดิม"
en = "Existing column"

[room_items.door_opening]
th = "ช่องประตูพอดีวงกบ"
en = "Door opening, to suit the frame"

[room_items.lintel]
th = "คานทับหลังสำเร็จรูปมวลเบา"
en = "Precast AAC lintel"

[room_items.window]
th = "หน้าต่าง"
en = "Window"

[room_items.door]
th = "ประตู (บานพับด้านเสา เปิดเข้า)"
en = "Door (hinged on the column side, opens in)"

