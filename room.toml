# ---------- the wording on the drawings ----------
# {name} fills in a value. Every label has th and en.

# ---------- norms ----------
# The values the design checks hold the room to (room_design_checks.py). Each comes from outside, so it
# says where from and when that was checked (README rule 10): id, th, en (what it is), item (the item it
# applies to), value (mm, or as its name says), standard (the source and what it says), url, checked.

[[norm]]
id = "wc_clearance"
th = "ที่ว่างด้านหน้าชักโครก"
en = "clear space in front of the toilet"
item = "toilet"
value = 534
standard = "FACQ, 'The 70 cm rule': 534 mm stated as the regulatory minimum in front of a toilet (70 cm recommended)"
url = "https://www.facq.be/en/private-customers/our-advice-for-your-projects/the-70-cm-rule-why-the-space-in-front-of-your-furniture-is-crucial-for-your-safety"
