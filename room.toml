mm = { th = "มม.", en = "mm" }
generated = { th = "สร้างจาก room.toml", en = "generated from room.toml" }
tile_top = { th = "ขอบกระเบื้อง {top}", en = "tile top {top}" }
floor_higher = { th = "พื้นยกสูง {h}", en = "floor {h} higher" }
higher = { th = "สูง", en = "higher" }
lower = { th = "ต่ำ", en = "lower" }
floor = { th = "พื้น", en = "floor" }
items = { th = "รายการอุปกรณ์", en = "Schedule of fittings" }
x_from = { th = "{axis} จาก{wall}", en = "{axis} from the {wall}" }
centre_height = { th = "ความสูงกึ่งกลางจากระดับพื้น", en = "centre height above floor level" }
dashed = { th = "เส้นประ = ติดผนังด้านบน (มองจากบน)", en = "dashed = mounted higher on the wall, seen from above" }
all_clear = { th = "จุดกึ่งกลางทุกจุดวางตำแหน่งห่างแนวยาแนวอย่างน้อย {min_clear} มม. หรือตรงแนวพอดี และไม่มีชิ้นใดชนกัน", en = "Every centre is set out at least {min_clear} mm off a joint (or exactly on one), and nothing clashes" }
tile_count = { th = "กระเบื้อง{tile} {need} แผ่น ({parts}) → ต้องใช้ {boxes} กล่อง วางแผนไว้ {planned} กล่อง (เหลือ {spare} แผ่น)", en = "{tile} {need} tiles ({parts}) → {boxes} boxes needed, {planned} planned ({spare} spare tiles)" }
# The design problems (room_design_checks.py): setting out and clashes, each a note for the architect — where, what, the rule, what to do.
warn_joint = { th = "{wall}, {item}: จุดกึ่งกลาง ({axis} {v}) วางตำแหน่งห่างแนวยาแนวเพียง {d} มม. — ต้องวางตำแหน่งรูเจาะให้ห่างแนวยาแนวอย่างน้อย {min} มม. หรือตรงแนวพอดี เพื่อไม่ให้เจาะโดนขอบกระเบื้องจนแตก", en = "{wall}, {item}: its centre ({axis} {v}) is set out only {d} mm from a tile joint — set every hole out at least {min} mm clear of a joint, or exactly on it, so the drill doesn't crack the tile edge" }
warn_set_out_off_wall = { th = "{wall}, {item}: วางตำแหน่ง{edge} — วางตำแหน่งใหม่ หรือตรวจขนาดของมัน", en = "{wall}, {item}: set out {edge} — set it out again, or check its size" }
edge_start = { th = "เลยปลายผนังด้านต้น (x = 0)", en = "past the start of the wall (x = 0)" }
edge_end = { th = "เลยปลายผนังอีกด้าน (x = {length})", en = "past the end of the wall (x = {length})" }
edge_floor = { th = "ต่ำกว่าระดับพื้น", en = "below the floor" }
edge_ceiling = { th = "สูงเกินฝ้าเพดาน ({ceiling})", en = "above the ceiling ({ceiling})" }
warn_set_out_off_floor = { th = "{item}: วางตำแหน่งนอกพื้นห้อง ({length} × {width}) — วางตำแหน่งใหม่ หรือตรวจขนาดของมัน", en = "{item}: set out outside the {length} × {width} floor — set it out again, or check its size" }
warn_clash = { th = "{wall}, {a} ชนกับ {b} — อุปกรณ์สองชิ้นอยู่ตำแหน่งเดียวกันบนผนังไม่ได้ ต้องวางตำแหน่งชิ้นใดชิ้นหนึ่งใหม่", en = "{wall}, {a} clashes with {b} — two fittings can't take the same place on the wall; set one of them out again" }
warn_in_opening = { th = "{wall}, {a} วางตำแหน่งอยู่ในช่องเปิด {b} — ตรงนั้นไม่มีผนังให้ยึด ต้องวางบนผนังทึบ", en = "{wall}, {a} is set out in the opening {b} — there is no wall there to fix it to; set it out on solid wall" }
warn_outside = { th = "{wall}, {item} ({axis} {v}) วางตำแหน่งนอกความกว้างของ{parent} ({low}–{high}) — เป็นส่วนหนึ่งของชิ้นนั้น ต้องวางตำแหน่งไปพร้อมกัน ไม่เช่นนั้นจะต่อไม่ถึงหรือมองเห็นได้", en = "{wall}, {item} ({axis} {v}) is set out outside the width of {parent} ({low}–{high}) — it belongs to that fitting, so set it out with it, or it won't connect or stay hidden" }
warn_above = { th = "{wall}, {item} ({axis} {v}) วางตำแหน่งสูงเกินขอบบนของ{parent} ({top}) — เป็นส่วนหนึ่งของชิ้นนั้น จะโผล่ให้เห็นเหนือมัน ต้องวางตำแหน่งให้ต่ำลง", en = "{wall}, {item} ({axis} {v}) is set out above the top of {parent} ({top}) — it belongs to that fitting and would show above it; set it out lower" }
warn_door_fit = { th = "{wall}: ช่องประตู ({door}) รวมกับเสาเดิม ({column}) ยาวเกินผนัง ({length}) — ใช้วงกบที่แคบลง หรือตรวจขนาดเสา", en = "{wall}: the door opening ({door}) and the existing column ({column}) don't fit in the wall's {length} — use a narrower door frame, or check the column" }
warn_lintel_short = { th = "{wall}: คานทับหลัง ({lintel}) สั้นกว่าช่องประตูรวมระยะวางบนผนัง ({door} + {bearing}) — คานจะวางบนผนังไม่ถึงทั้งสองข้าง ต้องใช้คานที่ยาวกว่านี้", en = "{wall}: the lintel ({lintel}) is shorter than the door opening plus its bearing ({door} + {bearing}) — it won't rest on the wall at both ends; use a longer lintel" }
warn_clearance = { th = "{wall}, {item}: ด้านหน้ามีที่ว่างเพียง {clear} มม. — ต้องเหลืออย่างน้อย {need} มม. จึงจะใช้งานได้ วางตำแหน่งใหม่ หรือเลือกรุ่นที่ยื่นน้อยกว่า", en = "{wall}, {item}: only {clear} mm clear in front of it — keep at least {need} mm so it can be used; set it out again or choose a shallower fitting" }
warn_rim_height = { th = "{wall}, {item}: ขอบบนวางตำแหน่งที่ {rim} มม. จากพื้น — ควรอยู่ระหว่าง {low} ถึง {high} มม.", en = "{wall}, {item}: its rim is set out {rim} mm above the floor — keep it between {low} and {high} mm" }
warn_zone_ip = { th = "{wall}, {item}: อยู่ในโซนไฟฟ้า {zone} รอบฝักบัว แต่มีระดับกันน้ำ {ip} — อุปกรณ์ไฟฟ้าในโซนนี้ต้องเป็น IPX{need} ขึ้นไป ย้ายให้ห่างออกไป หรือเลือกรุ่นที่กันน้ำได้", en = "{wall}, {item}: in electrical zone {zone} round the shower, but rated {ip} — anything electrical there must be IPX{need} or better; set it out further away or choose a rated fitting" }
warn_zone_no_ip = { th = "{wall}, {item}: เป็นอุปกรณ์ไฟฟ้าในโซน {zone} รอบหัวฝักบัว แต่ยังไม่ได้บันทึกระดับกันน้ำ (IP) — ดูที่ฉลากแล้วบันทึกไว้", en = "{wall}, {item}: electrical, in zone {zone} round the shower head, but no IP rating is recorded — read it off its label and record it" }
warn_clearance_door = { th = "{wall}, {item}: บานประตู {door} เปิดกวาดเข้ามาในที่ว่างด้านหน้า — วางตำแหน่งใหม่ หรือเปลี่ยนทิศการเปิดประตู", en = "{wall}, {item}: the door {door} swings into the clear space in front of it — set it out again, or change how the door opens" }
warn_waterproofing = { th = "{zone}: กันซึมสูง {height} มม. — ผนังส่วนอาบน้ำต้องกันซึมสูงอย่างน้อย {need} มม.", en = "{zone}: waterproofed to {height} mm — the shower walls must be waterproofed to at least {need} mm" }
warn_fall = { th = "พื้นลาดเอียง 1:{fall} สู่ท่อระบายน้ำ — ต้องลาดอย่างน้อย 1:{need}", en = "the floor falls 1:{fall} to the drain — make it at least 1:{need}" }
warn_drain_side = { th = "{drain} อยู่ด้านสูง (ด้านแห้ง) ของ{step} — ท่อระบายน้ำต้องอยู่ด้านต่ำที่รับน้ำจากฝักบัว", en = "{drain} is on the high (dry) side of {step} — the drain must be on the low side, which takes the shower water" }
waterproofing_line = { th = "กันซึม: ทั้งพื้น · ผนัง {walls} มม. · ในส่วนอาบน้ำ {zone} มม.", en = "Waterproofing: the whole floor · walls {walls} mm · in the shower zone {zone} mm" }
fall_line = { th = "พื้นลาดเอียง 1:{wet} สู่ท่อระบายน้ำด้านอาบน้ำ · 1:{dry} เข้าหาขั้นพื้นด้านแห้ง", en = "The floor falls 1:{wet} to the drain on the shower side · 1:{dry} towards the step on the dry side" }

# The marks on the drawings — the same in both languages, so one value each.
[symbols]
axis_x = "x"   # position and size in the legends: x 1500  y 400  W 375 × H 700
axis_y = "y"
width = "W"
height = "H"
none = "—"   # no value (a zone's height)
times = "×"
warning = "⚠"
ok = "✓"     # the all-clear
up = "▲"     # the higher side of the floor step
down = "▼"
dash = " — "   # between a name and what follows it
dot = " · "    # between items in a line
eq = " = "     # a letter and what it stands for
plus = " + "   # the parts of a tile count
