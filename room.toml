# room.toml — the room: its size and walls, the tiles, every item on the walls and the floor,
# and the wording on the drawings. Units: mm. room.py reads it and draws it.
# A product is named by its id on the materials list (materials.toml): an item that names one
# takes its name and size from there, never typed here.
# Every named thing has th and en; an item, the column, the door and the lintel can also have a
# note (note_th, note_en).
#
# The room is constructed this way (room.py works it out, never typed here): the existing column
# stands at the x = 0 end of its wall, the door opening is beside it, the lintel over it.

[room]
length = 3000              # along the first wall below
width = 1380               # along the second
ceiling = 2800
joint_clearance = 20       # a design check: every hole at least this far from a tile joint
                           # (or exactly on one) — checked, and printed under each drawing

[column]                   # the existing column; the rest of its wall is new
th = "เสาเดิม"
en = "Existing column"
width = 80
wall = "new_wall"

[door]                     # beside the column: the opening is its product's size
product = "door_frame"
hinge = "start"            # the end of the opening the leaf is hinged at: start (the column side) or end
swing = "out"              # in: the leaf opens into the room; out: out of it

[lintel]                   # over the door opening; its height is its product's
product = "lintel"
bearing = 150              # onto the wall; the column end sits in a shallow pocket

# ---------- tiles ----------
# Each tile: id (what the floor and the walls call it), product (its size and tiles per box come
# from there, and the tile count is matched against that product's boxes on the list), th, en
# (its name, for the tile counts), tiling_height (tiled up to this height on a wall), fill (its colour on
# the drawings).

[[tile]]
id = "grey"
product = "grey_tile"
th = "เทา"
en = "grey"
tiling_height = 2000
fill = "#d9d9d6"

[[tile]]
id = "white"
product = "white_tile"
th = "ขาว"
en = "white"
tiling_height = 1200
fill = "#f1f1ee"

# ---------- items: one shape for every item on a wall or the floor ----------
#   id         what a services point names it by (unique on its wall). Its number on the drawing is its order.
#   product    its name and size come from the product (so it has no th, en, w, h or d here)
#   th, en     its name, when it has no product
#   shape      on a wall: rect, circle (a fitting), point (a services point or fixing), zone (the wet zone),
#              opening · on the floor: rect, step (a level change)
#   x, y       its centre: x from the corner on your right, facing the wall from inside;
#              y above the lower finished floor. On the floor: x from the second wall, y from the first.
#   w, h, d    width, height, depth out from the wall (for the floor plan)
#   high       a step: which end is higher — start (x = 0) or end
#   fitting    a services point or fixing: the id of the fitting it serves (it must sit within it)
#   note_th, note_en   why or how — never where: a note doesn't repeat what the drawing shows
#   waterproofing      a zone only: waterproofed up to this height within it
#   assumed    the keys above whose values are assumed, not yet known for real (README rule 10);
#              mise run summary lists every one, to be replaced by the real figure
# Leave a key out when it does not apply.

# ---------- the floor ----------
[floor]                    # ref: its letter on the floor plan (F1, F2 …) · tile: which tile it gets
ref = "F"
tile = "grey"
drain = "drain"            # the floor item the floor falls to
fall_wet = 100             # the wet (low) side of the step falls 1 in this to the drain
fall_dry = 100             # the dry (high) side falls 1 in this towards the step
assumed = ["fall_wet", "fall_dry"]

