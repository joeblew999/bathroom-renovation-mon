# ---------- the wording on the drawings ----------
# {name} fills in a value. Every label has th and en.
[labels]
floor_plan = { th = "ผังพื้น", en = "Floor plan" }
elevation_title = { th = "{wall}{view}", en = "{wall}{view} — elevation" }
viewed_inside = { th = "มองจากในห้องน้ำ", en = "Viewed from inside the bathroom" }
seen_above = { th = "มองจากด้านบน", en = "Seen from above" }
mm = { th = "มม.", en = "mm" }
generated = { th = "สร้างจาก room.toml", en = "generated from room.toml" }
tile_top = { th = "ขอบกระเบื้อง", en = "tile top {top}" }
floor_higher = { th = "พื้นยกสูง {h}", en = "floor {h} higher" }
higher = { th = "▲ สูง", en = "higher" }
lower = { th = "ต่ำ", en = "lower ▼" }
floor = { th = "พื้น", en = "floor" }
items = { th = "รายการ", en = "Items" }
x_from = { th = "{axis} จาก{wall}", en = "from the {wall}" }
centre_height = { th = "ความสูงกึ่งกลาง", en = "centre height" }
see_notes = { th = "ดูหมายเหตุ", en = "see notes" }
dashed = { th = "เส้นประ = ติดผนังด้านบน (มองจากบน)", en = "dashed = mounted higher on the wall, seen from above" }
all_clear = { th = "✓ ทุกจุดห่างแนวยาแนวอย่างน้อย {min_clear} มม. หรืออยู่กึ่งกลางแนวพอดี และไม่มีชิ้นใดทับกัน", en = "✓ Every centre is at least {min_clear} mm off a joint (or exactly centred on one), and nothing overlaps" }
tile_count = { th = "กระเบื้อง{tile} {need} แผ่น ({parts}) → ต้องใช้ {boxes} กล่อง วางแผนไว้ {planned} กล่อง (เหลือ {spare} แผ่น)", en = "{tile} {need} tiles ({parts}) → {boxes} boxes needed, {planned} planned ({spare} spare tiles)" }
warn_joint = { th = "{item}: {axis} {v} ห่างแนวยาแนวเพียง {d} มม.", en = "{item}: {axis} {v} is only {d} mm from a joint" }
warn_past_end = { th = "{item}: เลยปลายผนัง", en = "{item}: runs past the end of the wall" }
warn_overlap = { th = "{a} ทับ {b}", en = "{a} overlaps {b}" }
warn_outside = { th = "{item}: {axis} {v} อยู่นอก{parent} ({low}–{high})", en = "{item}: {axis} {v} is outside {parent} ({low}–{high})" }
warn_above = { th = "{item}: {axis} {v} สูงเกินขอบบนของ{parent}", en = "{item}: {axis} {v} is above the top of {parent}" }
tile_short = { th = "กระเบื้อง{tile}: วางแผนไว้ {planned} กล่อง แต่ต้องใช้ {boxes} กล่อง", en = "{tile} tile: {planned} boxes planned but {boxes} needed" }

# The marks on the drawings — the same in both languages, so one value each.
[symbols]
axis_x = "x"   # position and size in the legends: x 1500  y 400  W 375 × H 700
axis_y = "y"
width = "W"
height = "H"
none = "—"   # no value (a zone's height)
times = "×"
warning = "⚠"
